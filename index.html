<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05010f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="TR4CE ⛳ — Golf Shot Tracer 高尔夫轨迹追踪">
  <meta property="og:description" content="蓄力挥杆, 追踪你的球路轨迹: 码数 · 弹道 · SLICE/DRAW 球型判定, 一键生成炫酷战绩卡 & 回放视频 🎥">
  <title>TR4CE ⛳ Golf Shot Tracer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <header id="top">
    <div id="logo">TR4CE<span>⛳ GOLF SHOT TRACER</span></div>
    <div id="pb">PB —</div>
  </header>

  <div id="minis">
    <canvas id="mapView"></canvas>
    <canvas id="arcView"></canvas>
  </div>

  <div id="controls">
    <div id="hint">按住 SWING 蓄力 · <b>HOLD TO CHARGE</b></div>
    <div id="clubs"></div>
    <div id="meters">
      <div class="meter" id="meterPower">
        <label>POWER 力量</label>
        <div class="track"><div id="powerFill"></div></div>
      </div>
      <div class="meter" id="meterCurve">
        <label>◀ DRAW&nbsp;&nbsp;·&nbsp;&nbsp;CURVE 弧线&nbsp;&nbsp;·&nbsp;&nbsp;FADE ▶</label>
        <div class="track curve"><div id="curveMark"></div></div>
      </div>
    </div>
    <button id="swingBtn">SWING</button>
  </div>

  <div id="panel" class="hidden">
    <div id="grabber"></div>
    <div id="badge">
      <span id="badgeEmoji">🎯</span>
      <div><b id="badgeName">PURE</b><i id="badgeZh">笔直穿透</i></div>
    </div>
    <div id="caption"></div>
    <div id="statCarry"><b id="carryNum">0</b><span>CARRY · YARDS 码</span></div>
    <div id="statGrid"></div>
    <div id="shareRow">
      <button id="btnCard">📸 战绩卡</button>
      <button id="btnVideo">🎥 回放视频</button>
      <button id="btnAgain" class="primary">🔁 再来一杆</button>
    </div>
    <div id="history"></div>
  </div>

  <div id="toast"></div>

  <script src="js/physics.js"></script>
  <script src="js/render.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
